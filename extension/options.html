<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>FreeDM - الإعدادات</title>
<style>body{font-family:Segoe UI,Tahoma,sans-serif;padding:16px;max-width:520px}
label{display:block;margin:10px 0 4px}input[type=text],input[type=number]{width:100%;padding:6px}</style>
</head>
<body>
<h3>إعدادات تكامل FreeDM</h3>
<label><input type="checkbox" id="enabled"> تفعيل التقاط التحميلات</label>

<label>توكن البرنامج (انسخه من إعدادات FreeDM)</label><input type="text" id="token">
<p><button id="save">حفظ</button> <span id="msg"></span></p>
<script src="options.js"></script>
</body>
</html>
